            --text: #ffffff;
            --border: rgba(212, 175, 55, 0.2);
            --card-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        [data-theme="light"] {
            --bg: #f8f9fa;
            --surface: rgba(0, 0, 0, 0.03);
            --text: #1a1a1a;
            --border: rgba(212, 175, 55, 0.4);
            --card-shadow: 0 15px 35px rgba(212, 175, 55, 0.1);
        }

        * { box-sizing: border-box; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
        }

        /* --- 3D Glass Navbar --- */
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 25px; background: var(--surface);
            backdrop-filter: blur(15px); position: sticky; top: 0; z-index: 1000;
            border-bottom: 2px solid var(--primary); box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        .logo-box {
            display: flex; align-items: center; gap: 10px;
            transform: perspective(500px) rotateX(10deg);
        }

        /* --- 3D Remote Console --- */
        .remote-console {
            display: flex; justify-content: center; gap: 20px;
            margin: 20px 0; perspective: 1000px;
        }

        .btn-3d {
            width: 55px; height: 55px; border-radius: 50%;
            background: var(--surface); border: 1px solid var(--primary);
            color: var(--primary); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; box-shadow: 0 8px 0 var(--border);
            position: relative; top: 0;
        }

        .btn-3d:active {
            top: 5px; box-shadow: 0 2px 0 var(--border);
        }

        .btn-3d:hover {
            background: var(--primary); color: #000;
            box-shadow: 0 0 20px var(--primary-glow);
        }

        /* --- Video Box --- */
        .player-container {
            max-width: 1000px; margin: 10px auto; padding: 15px;
            perspective: 2000px;
        }

        .video-3d {
            background: #000; border-radius: 25px; overflow: hidden;
            border: 4px solid var(--primary);
            transform: rotateX(5deg);
            box-shadow: 0 50px 100px rgba(0,0,0,0.5);
        }

        /* --- Category & Search --- */
        .controls-row {
            max-width: 1200px; margin: 0 auto; padding: 20px;
        }

        .chip-box {
            display: flex; gap: 12px; overflow-x: auto; padding: 10px 0;
            scrollbar-width: none;
        }

        .chip-3d {
            padding: 12px 28px; background: var(--surface);
            border: 1px solid var(--border); border-radius: 15px;
            cursor: pointer; white-space: nowrap; font-weight: 800;
            text-transform: uppercase; font-size: 12px;
        }

        .chip-3d.active {
            background: var(--primary); color: #000;
            transform: translateY(-5px) scale(1.1);
            box-shadow: 0 10px 20px var(--primary-glow);
        }

        /* --- 3D GRID --- */
        .grid-3d {
            display: grid; grid-template-columns: repeat(6, 1fr);
            gap: 25px; padding: 20px 0;
            perspective: 1500px;
        }

        .card-3d {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 20px; padding: 15px; text-align: center;
            cursor: pointer; position: relative;
            transform-style: preserve-3d;
            box-shadow: var(--card-shadow);
        }

        .card-3d:hover {
            transform: translateZ(50px) rotateY(15deg) translateY(-10px);
            border-color: var(--primary);
        }

        .card-3d img {
            width: 100%; aspect-ratio: 1/1; object-fit: contain;
            border-radius: 15px; margin-bottom: 12px;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.3));
        }

        /* Mobile Fix */
        @media (max-width: 768px) {
            .grid-3d { grid-template-columns: repeat(3, 1fr); gap: 15px; }
            .video-3d { transform: none; }
        }

        .theme-switch {
            font-size: 24px; cursor: pointer; color: var(--primary);
        }

        .footer-lux {
            padding: 60px 20px; text-align: center;
            border-top: 2px solid var(--primary);
            background: var(--surface); margin-top: 100px;
        }
    </style>
</head>

        let currentCat = "All";
        const player = document.getElementById('tvPlayer');

        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.getAttribute('data-theme') === 'dark';
            html.setAttribute('data-theme', isDark ? 'light' : 'dark');
            document.querySelector('.theme-switch i').className = isDark ? 'fas fa-sun' : 'fas fa-moon';
        }

        /* REMOTE LOGIC */
        function vol(v) { player.volume = Math.min(1, Math.max(0, player.volume + v)); }
        function mute() { 
            player.muted = !player.muted; 
            document.getElementById('muteIco').innerHTML = player.muted ? '<i class="fas fa-volume-mute"></i>' : '<i class="fas fa-volume-up"></i>';
        }
        function full() { 
            if (player.requestFullscreen) player.requestFullscreen(); 
            else if (player.webkitRequestFullscreen) player.webkitRequestFullscreen();
        }

        function render() {
            const grid = document.getElementById('mainGrid');
            const term = document.getElementById('search').value.toLowerCase();
            grid.innerHTML = "";
            channels.forEach((ch, i) => {
                if((currentCat === "All" || ch.category === currentCat) && ch.name.toLowerCase().includes(term)) {
                    const card = document.createElement('div');
                    card.className = 'card-3d';
                    card.onclick = () => playStream(ch.url);
                    card.innerHTML = `
                        <img src="${ch.logo}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/716/716429.png'">
                        <h4 style="margin:5px 0;">${ch.name}</h4>
                        <div style="font-size:10px; opacity:0.5;">${ch.category}</div>
                        ${isAdmin() ? `<i class="fas fa-trash" style="color:red; margin-top:10px;" onclick="event.stopPropagation(); del(${i})"></i>` : ''}
                    `;
                    grid.appendChild(card);
                }
            });
        }

        function playStream(url) {
            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(player);
                hls.on(Hls.Events.MANIFEST_PARSED, () => player.play());
            } else { player.src = url; player.play(); }
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        function isAdmin() { return new URLSearchParams(location.search).get("access") === "jlander"; }
        if(isAdmin()) document.getElementById('adminBtn').style.display = "block";

        function setCat(c, btn) {
            currentCat = c;
            document.querySelectorAll('.chip-3d').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            render();
        }

        function openModal() { document.getElementById('adminModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('adminModal').style.display = 'none'; }
        
        function save() {
            const fd = new FormData();
            fd.append('action', 'save');
            fd.append('name', document.getElementById('inName').value);
            fd.append('logo', document.getElementById('inLogo').value);
            fd.append('url', document.getElementById('inUrl').value);
            fd.append('category', document.getElementById('inCat').value);
            fetch(window.location.href, {method:'POST', body:fd}).then(() => location.reload());
        }

        function del(i) {
            if(confirm('Delete Stream?')) {
                const fd = new FormData(); fd.append('action', 'delete'); fd.append('index', i);
                fetch(window.location.href, {method:'POST', body:fd}).then(() => location.reload());
            }
        }

        render();
    </script>
